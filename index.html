<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Want-Hub Pro | 拡張版デモ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, updateDoc, increment, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Config ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wanthub-pro-mixed';

        let currentUser = null;
        let imageBase64 = null;
        let allPosts = []; // フィルター用に全データを保持
        let currentFilter = 'all';

        const toast = document.getElementById('toast');
        const showToast = (msg) => {
            toast.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        };

        // --- AI Analysis ---
        const analyzeImage = async (base64) => {
            document.getElementById('analysis-overlay').classList.remove('hidden');
            const apiKey = "";
            const systemPrompt = "あなたは商品査定士です。JSONで { \"name\": \"\", \"description\": \"\", \"estimatedPrice\": \"\", \"category\": \"\" } を返して。カテゴリーは「ファッション」「家電」「ホビー」「その他」から選んで。";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "画像を解析して" },
                                { inlineData: { mimeType: "image/png", data: base64.split(',')[1] } }
                            ]
                        }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const result = await response.json();
                const aiData = JSON.parse(result.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
                
                document.getElementById('input-name').value = aiData.name || "";
                document.getElementById('input-price').value = aiData.estimatedPrice || "";
                document.getElementById('input-desc').value = aiData.description || "";
                document.getElementById('input-category').value = aiData.category || "その他";
                showToast("AIがカテゴリーも含めて解析しました！");
            } catch (e) { console.error(e); }
            document.getElementById('analysis-overlay').classList.add('hidden');
        };

        // --- Event Listeners ---
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imageBase64 = ev.target.result;
                    const preview = document.getElementById('preview-img');
                    preview.src = imageBase64;
                    preview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    analyzeImage(imageBase64);
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                    name: document.getElementById('input-name').value,
                    price: document.getElementById('input-price').value,
                    desc: document.getElementById('input-desc').value,
                    category: document.getElementById('input-category').value,
                    imageUrl: imageBase64,
                    userId: currentUser.uid,
                    userName: `User-${currentUser.uid.slice(0, 4)}`,
                    createdAt: Date.now(),
                    haveCount: 0,
                    supportCount: 0
                });
                e.target.reset();
                document.getElementById('preview-img').classList.add('hidden');
                document.getElementById('upload-placeholder').classList.remove('hidden');
                imageBase64 = null;
                showToast("公開しました！");
            } catch (err) { console.error(err); }
        });

        // フィルターボタンの処理
        window.setFilter = (category) => {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('bg-red-500', btn.dataset.cat === category);
                btn.classList.toggle('text-white', btn.dataset.cat === category);
                btn.classList.toggle('bg-white', btn.dataset.cat !== category);
                btn.classList.toggle('text-gray-600', btn.dataset.cat !== category);
            });
            renderTimeline();
        };

        window.handleInteraction = async (postId, field) => {
            if (!currentUser) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId), { [field]: increment(1) });
        };

        const renderTimeline = () => {
            const container = document.getElementById('posts-timeline');
            const filtered = currentFilter === 'all' ? allPosts : allPosts.filter(p => p.category === currentFilter);
            
            container.innerHTML = filtered.map(post => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-all">
                    <div class="flex gap-4">
                        ${post.imageUrl ? `<img src="${post.imageUrl}" class="w-20 h-20 rounded-lg object-cover border border-gray-100 flex-shrink-0">` : ''}
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start mb-1">
                                <span class="px-2 py-0.5 rounded bg-gray-100 text-gray-500 text-[9px] font-bold uppercase">${post.category || 'その他'}</span>
                                <span class="text-[9px] text-gray-400">${new Date(post.createdAt).toLocaleDateString()}</span>
                            </div>
                            <h3 class="font-bold text-base truncate">${post.name}</h3>
                            <p class="text-red-500 font-bold text-sm">${post.price}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button onclick="handleInteraction('${post.id}', 'haveCount')" class="flex-1 flex items-center justify-center gap-1 text-[10px] font-bold text-slate-600 bg-slate-50 py-2 rounded-lg">
                            <i data-lucide="check-circle" class="w-3 h-3"></i> 持ってる (${post.haveCount || 0})
                        </button>
                        <button onclick="handleInteraction('${post.id}', 'supportCount')" class="flex-1 flex items-center justify-center gap-1 text-[10px] font-bold text-slate-600 bg-slate-50 py-2 rounded-lg">
                            <i data-lucide="heart" class="w-3 h-3"></i> 応援 (${post.supportCount || 0})
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const init = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snap) => {
                        allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                        renderTimeline();
                    });
                }
            });
            lucide.createIcons();
        };

        window.onload = init;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 px-4">
        <div class="max-w-5xl mx-auto h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="package" class="text-red-500 w-6 h-6"></i>
                <h1 class="text-lg font-black tracking-tighter">Want-Hub Pro</h1>
            </div>
            <!-- Profile Mixin: 他のコードとの「混ぜ合わせ」例 -->
            <div class="flex items-center gap-3 bg-slate-100 p-1 pr-3 rounded-full">
                <div class="w-8 h-8 bg-gradient-to-tr from-red-500 to-orange-400 rounded-full flex items-center justify-center text-white text-xs font-bold">W</div>
                <span class="text-[10px] font-bold text-slate-600">Guest User</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- Post Column -->
        <div class="md:col-span-5">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h2 class="font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-red-500"></i>新規投稿
                </h2>
                
                <div id="upload-area" onclick="document.getElementById('file-input').click()" class="relative h-40 border-2 border-dashed border-gray-200 rounded-2xl flex items-center justify-center cursor-pointer hover:bg-slate-50 transition-all overflow-hidden mb-4">
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                    <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden">
                    <div id="upload-placeholder" class="text-center">
                        <i data-lucide="camera" class="w-8 h-8 text-gray-300 mx-auto mb-1"></i>
                        <p class="text-[10px] text-gray-400 font-bold">写真を解析</p>
                    </div>
                    <div id="analysis-overlay" class="absolute inset-0 bg-white/80 hidden flex flex-col items-center justify-center gap-2">
                        <div class="w-6 h-6 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                        <span class="text-[10px] font-bold text-red-500">AI解析中...</span>
                    </div>
                </div>

                <form id="post-form" class="space-y-4">
                    <input type="text" id="input-name" placeholder="商品名" required class="w-full px-4 py-3 bg-slate-50 rounded-xl text-sm border-none focus:ring-2 focus:ring-red-500 outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="input-price" placeholder="希望価格" class="w-full px-4 py-3 bg-slate-50 rounded-xl text-sm border-none outline-none">
                        <select id="input-category" class="w-full px-4 py-3 bg-slate-50 rounded-xl text-sm border-none outline-none">
                            <option value="ファッション">ファッション</option>
                            <option value="家電">家電</option>
                            <option value="ホビー">ホビー</option>
                            <option value="その他" selected>その他</option>
                        </select>
                    </div>
                    <textarea id="input-desc" placeholder="詳細..." class="w-full px-4 py-3 bg-slate-50 rounded-xl text-sm border-none outline-none resize-none h-20"></textarea>
                    <button type="submit" class="w-full bg-red-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-100 hover:bg-red-600 active:scale-95 transition-all text-sm">
                        リストに追加する
                    </button>
                </form>
            </div>
        </div>

        <!-- Timeline Column -->
        <div class="md:col-span-7 space-y-6">
            <!-- Filter Mixin: 混ぜ合わせた新機能 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="setFilter('all')" data-cat="all" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-red-500 text-white shadow-sm transition-all">すべて</button>
                <button onclick="setFilter('ファッション')" data-cat="ファッション" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-600 shadow-sm transition-all">ファッション</button>
                <button onclick="setFilter('家電')" data-cat="家電" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-600 shadow-sm transition-all">家電</button>
                <button onclick="setFilter('ホビー')" data-cat="ホビー" class="filter-btn shrink-0 px-4 py-2 rounded-full text-xs font-bold bg-white text-gray-600 shadow-sm transition-all">ホビー</button>
            </div>

            <div id="posts-timeline" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Loading -->
                <div class="col-span-full text-center py-20 text-gray-300">
                    <div class="w-8 h-8 border-2 border-gray-200 border-t-red-500 rounded-full animate-spin mx-auto mb-2"></div>
                    <p class="text-[10px] font-bold uppercase tracking-widest">Loading Feed</p>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-bold transition-all transform translate-y-20 opacity-0 z-50"></div>

</body>
</html>
